<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Environment controls</title><style>body{font:15px system-ui;max-width:900px;margin:40px auto;padding:20px;color:#222}button,select{font:inherit;padding:9px;margin:5px}pre{background:#f6f6f6;padding:20px;overflow:auto}label{display:block;margin:20px 0}#error{color:#b00020}</style><h1>Environment controls</h1><p>Keep this page on your own screen. Present the <a href="/" target="_blank">Weverse customer journey</a>.</p><label>Member <select id="member"><option value="bts_army@gmail.com">BTS Army — active</option><option value="basic@example.com">Basic — no presale</option><option value="expired@example.com">Expired</option><option value="missing@example.com">No membership</option></select><button id="switch">Switch member</button></label><label><input id="decline" type="checkbox"> Decline payment</label><button id="reset">Reset orders and inventory</button><p id="error" role="alert"></p><h2>Active holds</h2><div id="holds"></div><h2>Service status and requests</h2><pre id="state"></pre><script>
const el=id=>document.getElementById(id);
async function control(path,body={}){el('error').textContent='';try{const r=await fetch('/sandbox/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Sandbox-Control':'1'},body:JSON.stringify(body)});if(!r.ok)throw Error('Control failed');await refresh();if(path==='reset')el('member').value='bts_army@gmail.com';}catch(e){el('error').textContent=e.message;}}
el('switch').onclick=()=>control('scenario',{email:el('member').value});el('decline').onchange=()=>control('scenario',{decline:el('decline').checked});el('reset').onclick=()=>{if(confirm('Reset all orders and holds?'))control('reset');};
async function refresh(){try{const r=await fetch('/sandbox/state');const s=await r.json();el('decline').checked=s.decline;el('state').textContent=JSON.stringify({member:s.email,services:s.services,orders:s.orders,requests:s.traces},null,2).replaceAll('Show Stop bridge','Ticketing API');el('holds').replaceChildren();for(const c of s.carts){const b=document.createElement('button');b.textContent='Expire '+c.cart_id+' ('+c.membership_id+')';b.onclick=()=>control('expire',{cartId:c.cart_id});el('holds').append(b);}}catch{el('error').textContent='Environment unavailable';}}
refresh();setInterval(refresh,3000);
</script></html>
